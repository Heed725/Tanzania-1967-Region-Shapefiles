name: Build Tanganyika 1950 Boundaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_tanganyika_1950.py'
      - '.github/workflows/build-tanganyika-1950.yml'

permissions:
  contents: write

concurrency:
  group: tanganyika-1950-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pyogrio shapely matplotlib pandas

      - name: Download Princeton historical Tanganyika 1950 boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_1950
          curl -L --fail --retry 3 \
            'https://figgy.princeton.edu/downloads/2bdebb26-357a-4f36-ba6d-001b7a40c38b/file/3bc8468e-bba4-4598-99e6-62ce2d29936e' \
            -o source_1950/source_download

          file source_1950/source_download
          if file source_1950/source_download | grep -qi 'Zip archive'; then
            unzip -q source_1950/source_download -d source_1950/extracted
          else
            # Some repository download endpoints may return a tar archive or another packaged form.
            mkdir -p source_1950/extracted
            cp source_1950/source_download source_1950/extracted/source_download
          fi

          find source_1950 -maxdepth 4 -type f -print

      - name: Build Tanganyika 1950 GIS layers
        run: |
          python scripts/build_tanganyika_1950.py \
            --source source_1950 \
            --output data/tanganyika_1950 \
            --dist dist \
            --docs docs

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f data/tanganyika_1950/Tanganyika_Provinces_1950.shp
          test -f data/tanganyika_1950/Tanganyika_Districts_1950.shp
          test -f data/tanganyika_1950/Tanganyika_Provinces_1950.geojson
          test -f data/tanganyika_1950/Tanganyika_Districts_1950.geojson
          test -f data/tanganyika_1950/Tanganyika_1950_Province_District_Crosswalk.csv
          test -f dist/Tanganyika_Provinces_1950_Shapefile.zip
          test -f dist/Tanganyika_Districts_1950_Shapefile.zip
          cat data/tanganyika_1950/summary.json

      - name: Commit generated historical GIS files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tanganyika_1950 dist docs/Tanganyika_1950_preview.png
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build Tanganyika 1950 historical boundaries'
            git push
          fi

      - name: Publish Tanganyika 1950 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='tanganyika-1950'
          TITLE='Tanganyika Provinces and Districts, 1950'

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets."
          else
            gh release create "$TAG" --title "$TITLE" --notes 'Historical Tanganyika province and district boundaries for 1950, derived from Princeton University Library digitization of a British Colonial Office map. Includes Shapefile ZIP, GeoJSON, GeoPackage, CSV crosswalk, and preview.'
          fi

          gh release upload "$TAG" \
            dist/Tanganyika_Provinces_1950_Shapefile.zip \
            dist/Tanganyika_Districts_1950_Shapefile.zip \
            data/tanganyika_1950/Tanganyika_Provinces_1950.geojson \
            data/tanganyika_1950/Tanganyika_Districts_1950.geojson \
            data/tanganyika_1950/Tanganyika_Provinces_1950.gpkg \
            data/tanganyika_1950/Tanganyika_Districts_1950.gpkg \
            data/tanganyika_1950/Tanganyika_1950_Province_District_Crosswalk.csv \
            data/tanganyika_1950/summary.json \
            docs/Tanganyika_1950_preview.png \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanganyika-1950-GIS
          path: |
            data/tanganyika_1950/
            dist/Tanganyika_*_1950_Shapefile.zip
            docs/Tanganyika_1950_preview.png
